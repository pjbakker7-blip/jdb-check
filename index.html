<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JdB 1-140</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>body{font-family:system-ui;padding:20px;max-width:600px;margin:auto}input,button,textarea{font-size:18px;padding:14px;width:100%;margin-top:10px;border-radius:10px;border:1px solid #ccc;box-sizing:border-box}button{font-weight:600}pre{background:#f4f4f4;padding:15px;white-space:pre-wrap;border-radius:10px}</style>
</head>
<body>
<h2>JdB Barendrecht - 1-140</h2>
<input type="file" accept="image/*" capture="environment" id="foto">
<textarea id="hand" rows="4" placeholder="Gelezen tekst komt hier..."></textarea>
<button id="bereken" style="background:#000;color:#fff;border:0">Bereken ontbrekende</button>
<pre id="out">Nog geen foto...</pre>
<button id="copy" style="display:none">Kopieer</button>
<button id="save" style="display:none;background:#007aff;color:white;border:0">Opslaan.txt</button>
<button id="mail" style="display:none;background:#111;color:white;border:0">Mail container@jgb-barendrecht.nl</button>
<script>
let laatste="";
async function berekenUitTekst(txt){
  const gevonden=[...new Set((txt.match(/\d+/g)||[]).map(Number).filter(n=>n>=1&&n<=140))].sort((a,b)=>a-b);
  const alle=Array.from({length:140},(_,i)=>i+1);
  const miss=alle.filter(n=>!gevonden.includes(n));
  laatste=miss.join('\n');
  try{await navigator.clipboard.writeText(laatste);}catch{}
  document.getElementById('out').textContent=`Gevonden (${gevonden.length}): ${gevonden.join(', ')}\n\nONTBREKEND (${miss.length}):\n${laatste}`;
  document.getElementById('copy').style.display='block';document.getElementById('save').style.display='block';document.getElementById('mail').style.display='block';
}
document.getElementById('foto').addEventListener('change', async e=>{
  const file=e.target.files[0]; if(!file) return;
  document.getElementById('out').textContent="⏳ Lezen...";
  const {data:{text}}=await Tesseract.recognize(file,'eng');
  document.getElementById('hand').value=text; berekenUitTekst(text);
});
document.getElementById('bereken').onclick=()=>berekenUitTekst(document.getElementById('hand').value);
document.getElementById('copy').onclick=async()=>{await navigator.clipboard.writeText(laatste); alert('Gekopieerd');};
document.getElementById('save').onclick=()=>{
  const naam=`JdB-ontbrekend-${new Date().toISOString().slice(0,10)}.txt`;
  const blob=new Blob([laatste],{type:'text/plain'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=naam; a.click();
};
document.getElementById('mail').onclick=()=>location.href=`mailto:container@jgb-barendrecht.nl?subject=JdB&body=${encodeURIComponent(laatste)}`;
</script>
</body>
</html>
