<!doctype html>
<html lang="nl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>JdB 1–140 – versie 25</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<style>*{box-sizing:border-box}body{font-family:Arial,sans-serif;margin:0;padding:14px;background:#f3f3f3;color:#111}main{max-width:780px;margin:auto}h2{margin:2px 0 8px}p{font-size:14px;color:#555;line-height:1.45}button,input,textarea{width:100%;font-size:18px;padding:14px;margin-top:9px;border-radius:11px;border:1px solid #aaa}button{font-weight:700;border:0;cursor:pointer}.black{background:#111;color:#fff}.blue{background:#1565c0;color:#fff}.green{background:#138a2e;color:#fff}.orange{background:#d97706;color:#fff}#status,#result,#found,#check{background:#fff;border-radius:11px;padding:12px;margin-top:12px}#result{font-size:23px;font-weight:700;line-height:1.55}#found{font-size:15px;line-height:1.55}textarea{min-height:160px}canvas{width:100%;height:auto;border-radius:10px;margin-top:12px;background:#fff}.hidden{display:none}.small{font-size:13px;color:#666}.warn{background:#fff3cd;padding:10px;border-radius:9px;margin-top:10px}.good{background:#e8f5e9;padding:10px;border-radius:9px;margin-top:10px}</style></head><body><main>
<h2>JdB 1–140</h2>
<p><strong>Versie 25:</strong> zoekt uitsluitend naar kleine groene tekst die op een lichte/witte achtergrond staat. Grote groene cirkels worden uitgesloten. OpenCV is verwijderd om de foutmelding van versie 24 te voorkomen.</p>
<input id="foto" type="file" accept="image/*" capture="environment"><canvas id="beeld"></canvas>
<div id="status">Klaar voor een foto.</div>
<textarea id="tekst" placeholder="Hier verschijnen de gevonden groene nummers. Eén nummer per regel."></textarea>
<button id="lees" class="black">Foto opnieuw lezen</button><button id="bereken" class="blue">Bereken ontbrekende nummers</button>
<div id="result" class="hidden"></div><div id="found" class="hidden"></div><div id="check" class="hidden"></div>
<button id="excel" class="green hidden">Excel downloaden</button><button id="mail" class="orange hidden">Ontbrekende nummers mailen</button>
<div id="mailstatus" class="small" style="margin-top:8px"></div>
</main><script>
const foto=document.getElementById('foto'),canvas=document.getElementById('beeld'),ctx=canvas.getContext('2d'),statusEl=document.getElementById('status'),tekst=document.getElementById('tekst'),result=document.getElementById('result'),found=document.getElementById('found'),check=document.getElementById('check'),excelBtn=document.getElementById('excel'),mailBtn=document.getElementById('mail'),mailstatus=document.getElementById('mailstatus');
const EMAILJS_PUBLIC_KEY='m1hQVTUwI0HgGdgmI',EMAILJS_SERVICE_ID='service_7gioqpl',EMAILJS_TEMPLATE_ID='template_t0gb12w';
let bestand=null,gevonden=[],ontbrekend=[],excelBlob=null,excelNaam='';
function status(s){statusEl.textContent=s}
function bereken(){const s=tekst.value.match(/\d+/g)||[];gevonden=[...new Set(s.map(Number).filter(n=>n>=1&&n<=140))].sort((a,b)=>a-b);const all=Array.from({length:140},(_,i)=>i+1);ontbrekend=all.filter(n=>!gevonden.includes(n));result.classList.remove('hidden');result.innerHTML='Ontbrekend: '+ontbrekend.length+'<br>'+ontbrekend.join('<br>');found.classList.remove('hidden');found.innerHTML='<b>Gevonden groene nummers:</b><br>'+(gevonden.length?gevonden.join('<br>'):'geen');check.classList.remove('hidden');check.innerHTML='<div class="good"><b>Controle:</b> alleen geselecteerde groene tekst op lichte achtergrond is gebruikt.</div>';maakExcel();excelBtn.classList.remove('hidden');mailBtn.classList.remove('hidden')}
function maakExcel(){const rows=[['JdB 1-140 - ontbrekende nummers'],['Datum',new Date().toLocaleString('nl-NL')],['Groene nummers gevonden',gevonden.length],['Aantal ontbrekende nummers',ontbrekend.length],[],['Ontbrekende nummers']];ontbrekend.forEach(n=>rows.push([n]));const ws=XLSX.utils.aoa_to_sheet(rows);ws['!cols']=[{wch:34}];const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Ontbrekend');const bytes=XLSX.write(wb,{bookType:'xlsx',type:'array'});excelBlob=new Blob([bytes],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});excelNaam='JdB_ontbrekende_nummers_'+new Date().toISOString().slice(0,10)+'.xlsx'}
async function laadFoto(){const img=new Image();img.src=URL.createObjectURL(bestand);await new Promise((ok,fout)=>{img.onload=ok;img.onerror=fout});const max=1600,s=Math.min(1,max/img.width);canvas.width=Math.round(img.width*s);canvas.height=Math.round(img.height*s);ctx.drawImage(img,0,0,canvas.width,canvas.height);URL.revokeObjectURL(img.src)}
function isGreen(r,g,b){return g>65 && g>r*1.12 && g>b*1.04 && (g-r)>18 && (g-b)>8}
function isWhiteish(r,g,b){return r>185&&g>185&&b>185&&(Math.max(r,g,b)-Math.min(r,g,b)<55)}
function makeGreenMask(){const w=canvas.width,h=canvas.height,im=ctx.getImageData(0,0,w,h),m=new Uint8Array(w*h);for(let y=0;y<h;y++){let p=y*w*4, q=y*w;for(let x=0;x<w;x++,p+=4,q++){if(isGreen(im.data[p],im.data[p+1],im.data[p+2]))m[q]=1}}return {m,w,h,data:im.data}}
function components(mask){const {m,w,h,data}=mask,seen=new Uint8Array(w*h),out=[];const stackX=new Int32Array(Math.min(w*h,500000)),stackY=new Int32Array(Math.min(w*h,500000));for(let y=0;y<h;y++)for(let x=0;x<w;x++){const start=y*w+x;if(!m[start]||seen[start])continue;let sp=0;stackX[sp]=x;stackY[sp]=y;seen[start]=1;let minX=x,maxX=x,minY=y,maxY=y,area=0;while(sp>=0){const cx=stackX[sp],cy=stackY[sp--];area++;if(cx<minX)minX=cx;if(cx>maxX)maxX=cx;if(cy<minY)minY=cy;if(cy>maxY)maxY=cy;const ns=[[cx+1,cy],[cx-1,cy],[cx,cy+1],[cx,cy-1]];for(const [nx,ny] of ns){if(nx<0||nx>=w||ny<0||ny>=h)continue;const k=ny*w+nx;if(m[k]&&!seen[k]){seen[k]=1;if(sp+1<stackX.length){stackX[++sp]=nx;stackY[sp]=ny}}}}const bw=maxX-minX+1,bh=maxY-minY+1;if(area>=25&&area<=1400&&bw>=4&&bw<=70&&bh>=8&&bh<=70){let white=0,total=0;const pad=10,x0=Math.max(0,minX-pad),x1=Math.min(w,maxX+pad+1),y0=Math.max(0,minY-pad),y1=Math.min(h,maxY+pad+1);for(let yy=y0;yy<y1;yy++){let p=(yy*w+x0)*4;for(let xx=x0;xx<x1;xx++,p+=4){if(!isGreen(data[p],data[p+1],data[p+2])){total++;if(isWhiteish(data[p],data[p+1],data[p+2]))white++}}}if(total&&white/total>.35)out.push({x:minX,y:minY,w:bw,h:bh,a:area,cx:(minX+maxX)/2,cy:(minY+maxY)/2})}}return out}
function filterTextComps(cs){/* circles are huge; this second filter removes components that are clearly parts of green circular objects */return cs.filter(c=>{const aspect=c.w/c.h;return c.h>=12&&c.h<=65&&aspect>=.15&&aspect<=3.5})}
function group(cs){cs.sort((a,b)=>a.cy-b.cy||a.x-b.x);const rows=[];for(const c of cs){let r=rows.find(r=>Math.abs(c.cy-r.cy)<Math.max(18,c.h*.55));if(!r){r={items:[],cy:c.cy};rows.push(r)}r.items.push(c);r.cy=r.items.reduce((s,z)=>s+z.cy,0)/r.items.length}const gs=[];for(const r of rows){r.items.sort((a,b)=>a.x-b.x);let cur=[];for(const c of r.items){if(!cur.length||c.x-(cur[cur.length-1].x+cur[cur.length-1].w)<45)cur.push(c);else{gs.push(cur);cur=[c]}}if(cur.length)gs.push(cur)}return gs.filter(g=>g.length>=1&&g.length<=3)}
function cropGroup(g){const pad=12,x0=Math.max(0,Math.min(...g.map(c=>c.x))-pad),y0=Math.max(0,Math.min(...g.map(c=>c.y))-pad),x1=Math.min(canvas.width,Math.max(...g.map(c=>c.x+c.w))+pad),y1=Math.min(canvas.height,Math.max(...g.map(c=>c.y+c.h))+pad);const t=document.createElement('canvas');t.width=x1-x0;t.height=y1-y0;t.getContext('2d').drawImage(canvas,x0,y0,t.width,t.height,x0,y0,t.width,t.height);return t}
async function ocrGroup(g,worker){const crop=cropGroup(g),w=Math.max(1,crop.width),h=Math.max(1,crop.height),im=crop.getContext('2d').getImageData(0,0,w,h),out=new ImageData(w,h);for(let i=0;i<im.data.length;i+=4){const r=im.data[i],gg=im.data[i+1],b=im.data[i+2];const keep=isGreen(r,gg,b);const v=keep?0:255;out.data[i]=out.data[i+1]=out.data[i+2]=v;out.data[i+3]=255}const bc=document.createElement('canvas');bc.width=w;bc.height=h;bc.getContext('2d').putImageData(out,0,0);const up=document.createElement('canvas');up.width=w*5;up.height=h*5;up.getContext('2d').drawImage(bc,0,0,up.width,up.height);const r=await worker.recognize(up,{config:{tessedit_pageseg_mode:'7',tessedit_char_whitelist:'0123456789'}});return (r.data.text||'').replace(/[^0-9]/g,'')}
async function leesEenKeer(){if(!bestand)return;try{status('Foto voorbereiden...');await laadFoto();status('Groene tekst op witte achtergrond zoeken...');const mask=makeGreenMask(),cs=filterTextComps(components(mask));const groups=group(cs);if(!groups.length){tekst.value='';status('Geen groene tekst gevonden.');bereken();return}status(groups.length+' mogelijke groene tekstvelden gevonden.');const worker=await Tesseract.createWorker('eng',1,{logger:m=>{if(m.status==='recognizing text')status('Cijferherkenning: '+Math.round((m.progress||0)*100)+'%')}});const nums=[];for(let i=0;i<groups.length;i++){status('Groen nummer '+(i+1)+' van '+groups.length+' lezen...');const s=await ocrGroup(groups[i],worker);const n=Number(s);if(Number.isInteger(n)&&n>=1&&n<=140)nums.push(n)}await worker.terminate();tekst.value=[...new Set(nums)].sort((a,b)=>a-b).join('\n');bereken();status('Klaar.');}catch(err){console.error(err);status('Fout: '+(err&&err.message?err.message:String(err)))}}
foto.addEventListener('change',e=>{bestand=e.target.files[0];if(bestand)leesEenKeer()});document.getElementById('lees').onclick=leesEenKeer;document.getElementById('bereken').onclick=bereken;
excelBtn.onclick=()=>{if(!excelBlob)maakExcel();const u=URL.createObjectURL(excelBlob),a=document.createElement('a');a.href=u;a.download=excelNaam;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)};
mailBtn.onclick=async()=>{try{emailjs.init({publicKey:EMAILJS_PUBLIC_KEY});mailstatus.textContent='E-mail wordt verstuurd...';await emailjs.send(EMAILJS_SERVICE_ID,EMAILJS_TEMPLATE_ID,{subject:'JdB ontbrekende nummers '+new Date().toLocaleDateString('nl-NL'),message:'Overzicht van de ontbrekende nummers uit de JdB-controle.\n\nAantal groene nummers herkend: '+gevonden.length+'\nAantal ontbrekende nummers: '+ontbrekend.length+'\n\nOntbrekende nummers:\n'+ontbrekend.join('\n'),to_email:'container@jdb-barendrecht.nl',datum:new Date().toLocaleString('nl-NL'),gevonden:gevonden.length,ontbrekend:ontbrekend.length,lijst:ontbrekend.join('\n')});mailstatus.textContent='E-mail is verstuurd naar container@jdb-barendrecht.nl.'}catch(err){console.error(err);mailstatus.textContent='E-mail niet verstuurd: '+(err.text||err.message||err)}};
</script></body></html>
