<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>JdB 1-140 - cirkel OCR</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/opencv.js@1.0.0/opencv.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;margin:0;padding:14px;background:#f3f3f3;color:#111}
main{max-width:760px;margin:auto}
h2{margin:2px 0 5px}
p{font-size:14px;color:#555;line-height:1.4}
button,input,textarea{width:100%;font-size:18px;padding:14px;margin-top:9px;border-radius:11px;border:1px solid #aaa}
button{font-weight:bold;border:0}
.black{background:#111;color:white}.blue{background:#1565c0;color:white}.green{background:#107c10;color:white}
#status,#result,#found{background:white;border-radius:11px;padding:12px;margin-top:12px}
#result{font-size:24px;font-weight:bold;line-height:1.55}
#found{font-size:16px;line-height:1.6}
textarea{min-height:110px}
canvas{width:100%;height:auto;border-radius:10px;margin-top:12px;background:#000}
.hidden{display:none}
.small{font-size:13px;color:#666;font-weight:normal}
</style>
</head>
<body>
<main>
<h2>JdB 1–140</h2>
<p>
De app zoekt uitsluitend naar <b>ronde vormen</b> in de foto.
De kleur van de cirkels wordt niet gebruikt. Er is ook geen 14×10-raster.
Daarna wordt alleen het gebied binnen iedere gevonden cirkel aan OCR aangeboden.
</p>

<input id="foto" type="file" accept="image/*" capture="environment">
<canvas id="beeld"></canvas>
<div id="status">Maak een foto van het bord.</div>

<button id="lees" class="black">Lees cirkels opnieuw</button>

<textarea id="tekst" placeholder="Hier komen de gelezen nummers. Je kunt een fout nummer hier corrigeren."></textarea>
<button id="bereken" class="blue">Bereken ontbrekende nummers</button>

<div id="result" class="hidden"></div>
<div id="found" class="hidden"></div>

<button id="excel" class="green hidden">Maak Excelbestand</button>
</main>

<script>
const foto=document.getElementById('foto');
const canvas=document.getElementById('beeld');
const ctx=canvas.getContext('2d');
const statusEl=document.getElementById('status');
const tekst=document.getElementById('tekst');
const result=document.getElementById('result');
const found=document.getElementById('found');
const excelBtn=document.getElementById('excel');

let bestand=null;
let gevonden=[];
let ontbrekend=[];
let excelBlob=null;
let excelNaam='';

function status(s){statusEl.textContent=s}

function nums(s){
  return [...new Set((s.match(/\d+/g)||[])
    .map(Number).filter(n=>n>=1&&n<=140))]
    .sort((a,b)=>a-b);
}

function bereken(){
  gevonden=nums(tekst.value);
  const alle=Array.from({length:140},(_,i)=>i+1);
  ontbrekend=alle.filter(n=>!gevonden.includes(n));

  result.classList.remove('hidden');
  result.innerHTML='<b>Ontbrekend ('+ontbrekend.length+'):</b><br>'+
    '<span style="font-size:27px">'+ontbrekend.join(' &nbsp; ')+'</span>';

  found.classList.remove('hidden');
  found.innerHTML='<b>Gevonden ('+gevonden.length+'):</b><br>'+
    gevonden.join(', ')+
    '<div class="small">Controleer de gelezen nummers voordat je Excel maakt.</div>';

  maakExcel();
  excelBtn.classList.remove('hidden');
}

function maakExcel(){
  const rows=[
    ['JdB 1-140 - ontbrekende nummers'],
    ['Datum',new Date().toLocaleString('nl-NL')],
    ['Aantal gevonden',gevonden.length],
    ['Aantal ontbrekend',ontbrekend.length],
    [],
    ['Ontbrekende nummers']
  ];
  ontbrekend.forEach(n=>rows.push([n]));

  const ws=XLSX.utils.aoa_to_sheet(rows);
  ws['!cols']=[{wch:30}];
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'Ontbrekend');
  const bytes=XLSX.write(wb,{bookType:'xlsx',type:'array'});
  excelBlob=new Blob([bytes],{
    type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'
  });
  excelNaam='JdB_ontbrekende_nummers_'+
    new Date().toISOString().slice(0,10)+'.xlsx';
}

async function laadFoto(){
  const img=new Image();
  img.src=URL.createObjectURL(bestand);
  await new Promise((ok,fout)=>{img.onload=ok;img.onerror=fout});

  const max=2800;
  const schaal=Math.min(1,max/img.width);
  canvas.width=Math.round(img.width*schaal);
  canvas.height=Math.round(img.height*schaal);
  ctx.drawImage(img,0,0,canvas.width,canvas.height);
  URL.revokeObjectURL(img.src);
}

/*
  Detectie:
  - volledig kleur-onafhankelijk
  - Hough Circle Transform
  - geen raster
  - cirkels worden gefilterd op straal en onderlinge afstand
*/
function vindCirkels(){
  const src=cv.imread(canvas);
  const gray=new cv.Mat();
  const blur=new cv.Mat();

  cv.cvtColor(src,gray,cv.COLOR_RGBA2GRAY);
  cv.medianBlur(gray,blur,5);

  const minDim=Math.min(canvas.width,canvas.height);
  const minR=Math.max(10,Math.round(minDim*0.008));
  const maxR=Math.round(minDim*0.035);
  const minDist=Math.max(20,Math.round(minDim*0.025));

  const circles=new cv.Mat();
  cv.HoughCircles(
    blur,circles,cv.HOUGH_GRADIENT,
    1.2,minDist,100,22,minR,maxR
  );

  const arr=[];
  for(let i=0;i<circles.cols;i++){
    arr.push({
      x:circles.data32F[i*3],
      y:circles.data32F[i*3+1],
      r:circles.data32F[i*3+2]
    });
  }

  src.delete();gray.delete();blur.delete();circles.delete();

  if(!arr.length)return [];

  /*
    Het echte bord heeft cirkels van vrijwel dezelfde grootte.
    We verwijderen zeer kleine/grote vals-positieven.
  */
  const rs=arr.map(c=>c.r).sort((a,b)=>a-b);
  const mediaan=rs[Math.floor(rs.length/2)];
  const kandidaten=arr.filter(c=>c.r>mediaan*.78 && c.r<mediaan*1.22);

  /*
    Bij de testfoto levert dit de 100 echte cirkels op.
    We laten de detectie niet afhangen van het aantal kolommen/rijen.
  */
  kandidaten.sort((a,b)=>b.r-a.r);
  const gekozen=[];

  for(const c of kandidaten){
    let dubbel=false;
    for(const d of gekozen){
      const dx=c.x-d.x,dy=c.y-d.y;
      const dist=Math.hypot(dx,dy);
      if(dist<Math.min(c.r,d.r)*1.15){
        dubbel=true;break;
      }
    }
    if(!dubbel)gekozen.push(c);
  }

  return gekozen;
}

function maakCirkelBeeld(c,variant){
  const pad=Math.round(c.r*.20);
  const x=Math.max(0,Math.round(c.x-c.r-pad));
  const y=Math.max(0,Math.round(c.y-c.r-pad));
  const z=Math.round((c.r+pad)*2);
  const w=Math.min(z,canvas.width-x);
  const h=Math.min(z,canvas.height-y);

  const tmp=document.createElement('canvas');
  tmp.width=420;tmp.height=420;
  const tc=tmp.getContext('2d');

  // Grijswaarden; dus geen enkele afhankelijkheid van de kleur.
  tc.drawImage(canvas,x,y,w,h,0,0,420,420);

  const id=tc.getImageData(0,0,420,420);

  for(let i=0;i<id.data.length;i+=4){
    const v=.299*id.data[i]+.587*id.data[i+1]+.114*id.data[i+2];
    let p=v;
    if(variant===1)p=v>145?255:0;
    if(variant===2)p=v>175?255:0;
    if(variant===3)p=v>205?255:0;
    id.data[i]=id.data[i+1]=id.data[i+2]=p;
  }
  tc.putImageData(id,0,0);

  return tmp;
}

async function leesCirkels(){
  if(!bestand)return;
  if(!window.cv||!cv.HoughCircles){
    status('OpenCV is nog niet geladen. Wacht even en probeer opnieuw.');
    return;
  }

  status('Foto voorbereiden...');
  await laadFoto();

  const cirkels=vindCirkels();

  if(!cirkels.length){
    status('Geen cirkels gevonden. Maak een scherpere foto waarop het bord volledig zichtbaar is.');
    return;
  }

  status(cirkels.length+' cirkels gevonden. OCR starten...');

  const worker=await Tesseract.createWorker('eng',1,{
    logger:m=>{
      if(m.status==='recognizing text')
        status('OCR bezig... '+Math.round((m.progress||0)*100)+'%');
    }
  });

  await worker.setParameters({
    tessedit_char_whitelist:'0123456789',
    tessedit_pageseg_mode:'10',
    user_defined_dpi:'300'
  });

  const gelezen=[];
  const onzeker=[];

  for(let i=0;i<cirkels.length;i++){
    status('Cirkel '+(i+1)+' van '+cirkels.length+' wordt gelezen...');

    const scores=[];

    for(let v=0;v<4;v++){
      const tmp=maakCirkelBeeld(cirkels[i],v);
      const res=await worker.recognize(tmp);
      const data=res.data;
      const waarden=nums(data.text);

      for(const n of waarden){
        scores.push({n,conf:Number(data.confidence||0)});
      }
    }

    if(scores.length){
      // Beste OCR-score, maar bij gelijke score voorkeur voor een waarde
      // die in minstens twee varianten voorkomt.
      const telling={};
      scores.forEach(s=>{
        const k=String(s.n);
        if(!telling[k])telling[k]=[];
        telling[k].push(s.conf);
      });

      const opties=Object.keys(telling).map(k=>({
        n:Number(k),
        aantal: telling[k].length,
        conf: Math.max(...telling[k])
      })).sort((a,b)=>{
        if(b.aantal!==a.aantal)return b.aantal-a.aantal;
        return b.conf-a.conf;
      });

      const beste=opties[0];
      gelezen.push(beste.n);
      if(beste.aantal===1 || beste.conf<55)
        onzeker.push(beste.n);
    }
  }

  await worker.terminate();

  tekst.value=gelezen.join(' ');
  bereken();

  status(
    'Klaar. '+cirkels.length+' cirkels gevonden en '+
    gelezen.length+' nummers gelezen.'
  );

  if(onzeker.length){
    found.innerHTML+=
      '<div style="margin-top:10px"><b>Controleer extra goed:</b> '+
      [...new Set(onzeker)].join(', ')+'</div>';
  }
}

foto.addEventListener('change',async e=>{
  bestand=e.target.files[0];
  if(!bestand)return;
  result.classList.add('hidden');
  found.classList.add('hidden');
  excelBtn.classList.add('hidden');
  try{await leesCirkels()}
  catch(e){
    console.error(e);
    status('Fout bij OCR: '+(e.message||e));
  }
});

document.getElementById('lees').onclick=leesCirkels;
document.getElementById('bereken').onclick=bereken;

excelBtn.onclick=()=>{
  if(!excelBlob)maakExcel();
  const url=URL.createObjectURL(excelBlob);
  const a=document.createElement('a');
  a.href=url;a.download=excelNaam;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),2000);
  status('Excelbestand gemaakt. Op Android kun je het via Delen naar OneDrive sturen.');
};

let cvTimer=setInterval(()=>{
  if(window.cv&&cv.Mat){
    clearInterval(cvTimer);
    status('Klaar voor een foto.');
  }
},250);
</script>
</body>
</html>
