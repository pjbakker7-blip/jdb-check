}
function maakExcel(){
  const rows=[['JdB 1-140 - ontbrekende nummers'],['Datum',new Date().toLocaleString('nl-NL')],['Cirkels gevonden',cirkels.length],['Unieke nummers herkend',gevonden.length],['Aantal ontbrekende nummers',ontbrekend.length],[],['Ontbrekende nummers']];
  ontbrekend.forEach(n=>rows.push([n]));
  const ws=XLSX.utils.aoa_to_sheet(rows);ws['!cols']=[{wch:34}];
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Ontbrekend');
  const bytes=XLSX.write(wb,{bookType:'xlsx',type:'array'});
  excelBlob=new Blob([bytes],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  excelNaam='JdB_ontbrekende_nummers_'+new Date().toISOString().slice(0,10)+'.xlsx';
}
async function laadFoto(){
  const img=new Image();img.src=URL.createObjectURL(bestand);
  await new Promise((ok,fout)=>{img.onload=ok;img.onerror=fout;});
  const max=2200,schaal=Math.min(1,max/img.width);canvas.width=Math.round(img.width*schaal);canvas.height=Math.round(img.height*schaal);ctx.drawImage(img,0,0,canvas.width,canvas.height);URL.revokeObjectURL(img.src);
}
function vindCirkels(){
  const scale=Math.min(1,1600/canvas.width),sw=Math.round(canvas.width*scale),sh=Math.round(canvas.height*scale);
  const klein=document.createElement('canvas');klein.width=sw;klein.height=sh;klein.getContext('2d').drawImage(canvas,0,0,sw,sh);
  const src=cv.imread(klein),gray=new cv.Mat(),blur=new cv.Mat(),circles=new cv.Mat();
  cv.cvtColor(src,gray,cv.COLOR_RGBA2GRAY);cv.GaussianBlur(gray,blur,new cv.Size(5,5),1.2);
  const minDist=Math.max(45,Math.round(Math.min(sw,sh)/18));
  cv.HoughCircles(blur,circles,cv.HOUGH_GRADIENT,1.2,minDist,100,30,20,70);
  const raw=[];for(let i=0;i<circles.cols;i++)raw.push({x:circles.data32F[i*3]/scale,y:circles.data32F[i*3+1]/scale,r:circles.data32F[i*3+2]/scale});
  src.delete();gray.delete();blur.delete();circles.delete();
  raw.sort((a,b)=>b.r-a.r);const out=[];
  for(const c of raw){if(out.every(d=>Math.hypot(c.x-d.x,c.y-d.y)>Math.max(.75*c.r,.75*d.r)))out.push(c);}
  return out;
}
function getGray(c){
  const s=Math.max(30,Math.round(c.r*1.02)),x0=Math.max(0,Math.round(c.x-s)),y0=Math.max(0,Math.round(c.y-s)),x1=Math.min(canvas.width,Math.round(c.x+s+1)),y1=Math.min(canvas.height,Math.round(c.y+s+1));
  const w=x1-x0,h=y1-y0,cc=document.createElement('canvas');cc.width=w;cc.height=h;cc.getContext('2d').drawImage(canvas,x0,y0,w,h,0,0,w,h);
  const d=cc.getContext('2d').getImageData(0,0,w,h).data,g=new Uint8Array(w*h);
  for(let i=0,j=0;i<d.length;i+=4,j++)g[j]=Math.round(.299*d[i]+.587*d[i+1]+.114*d[i+2]);
  return {g,w,h};
}
function otsu(vals){
  const hist=new Array(256).fill(0);for(const v of vals)hist[v]++;
  let total=vals.length,sum=0;for(let t=0;t<256;t++)sum+=t*hist[t];
  let sumB=0,wB=0,best=0,thr=150;
  for(let t=0;t<256;t++){wB+=hist[t];if(!wB)continue;const wF=total-wB;if(!wF)break;sumB+=t*hist[t];const mB=sumB/wB,mF=(sum-sumB)/wF;const v=wB*wF*(mB-mF)*(mB-mF);if(v>best){best=v;thr=t;}}
  return Math.max(110,Math.min(220,thr));
}
function extractGlyphs(c){
  const q=getGray(c),g=q.g,w=q.w,h=q.h,cx=w/2,cy=h/2,rr=c.r*.92,vals=[];
  for(let y=0;y<h;y++)for(let x=0;x<w;x++)if((x-cx)*(x-cx)+(y-cy)*(y-cy)<rr*rr)vals.push(g[y*w+x]);
  const thr=otsu(vals),bw=new Uint8Array(w*h);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const k=y*w+x;bw[k]=((x-cx)*(x-cx)+(y-cy)*(y-cy)<rr*rr&&g[k]>=thr)?1:0;}
  const seen=new Uint8Array(w*h),comps=[],qx=new Int32Array(w*h),qy=new Int32Array(w*h);
  for(let sy=0;sy<h;sy++)for(let sx=0;sx<w;sx++){
    const start=sy*w+sx;if(!bw[start]||seen[start])continue;
    let head=0,tail=0,minx=sx,maxx=sx,miny=sy,maxy=sy,area=0;
    qx[tail]=sx;qy[tail]=sy;tail++;seen[start]=1;
    while(head<tail){
      const x=qx[head],y=qy[head];head++;area++;if(x<minx)minx=x;if(x>maxx)maxx=x;if(y<miny)miny=y;if(y>maxy)maxy=y;
      for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
        if(!dx&&!dy)continue;const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=w||ny>=h)continue;const nk=ny*w+nx;
        if(bw[nk]&&!seen[nk]){seen[nk]=1;qx[tail]=nx;qy[tail]=ny;tail++;}
      }
    }
    const cw=maxx-minx+1,ch=maxy-miny+1;
    if(area>=20&&ch>=10&&ch<=h*.8&&cw<=w*.6)comps.push({x:minx,y:miny,w:cw,h:ch,area});
  }
  comps.sort((a,b)=>a.x-b.x);
  return comps;
}
function glyphImage(c,comp){
  const out=document.createElement('canvas');out.width=MODEL_W;out.height=MODEL_H;const oc=out.getContext('2d');
  oc.fillStyle='#000';oc.fillRect(0,0,MODEL_W,MODEL_H);
  const q=getGray(c),g=q.g,w=q.w,h=q.h,cx=w/2,cy=h/2,rr=c.r*.92,vals=[];
  for(let y=0;y<h;y++)for(let x=0;x<w;x++)if((x-cx)*(x-cx)+(y-cy)*(y-cy)<rr*rr)vals.push(g[y*w+x]);
  const thr=otsu(vals);
  const src=document.createElement('canvas');src.width=comp.w;src.height=comp.h;const sc=src.getContext('2d');
  const im=sc.createImageData(comp.w,comp.h);
  for(let y=0;y<comp.h;y++)for(let x=0;x<comp.w;x++){const v=g[(comp.y+y)*w+comp.x+x]>=thr?255:0;const p=(y*comp.w+x)*4;im.data[p]=im.data[p+1]=im.data[p+2]=v;im.data[p+3]=255;}
  sc.putImageData(im,0,0);oc.imageSmoothingEnabled=true;oc.drawImage(src,0,0,MODEL_W,MODEL_H);
  const d=oc.getImageData(0,0,MODEL_W,MODEL_H).data,a=new Uint8Array(MODEL_W*MODEL_H);
  for(let i=0;i<a.length;i++)a[i]=d[i*4]>100?255:0;return a;
}
function classify(a){
  let best=null,second=null;
  for(const m of MODEL){let dist=0;for(let i=0;i<a.length;i++){const d=a[i]-m.pix[i];dist+=d*d;}dist/=a.length;
    if(best===null||dist<best.dist){second=best;best={digit:m.digit,dist:dist};}else if(second===null||dist<second.dist)second={digit:m.digit,dist:dist};}
  const margin=second?1-best.dist/(second.dist+1):1;return {digit:best.digit,margin:Math.max(0,margin),dist:best.dist};
}
function herkenCirkel(c){
  const comps=extractGlyphs(c);if(!comps.length||comps.length>3)return {number:null,confidence:0,reason:'cijferdelen niet betrouwbaar gevonden'};
  let s='',conf=1;for(const comp of comps){const r=classify(glyphImage(c,comp));s+=r.digit;conf=Math.min(conf,r.margin);}
  const n=Number(s);if(!Number.isInteger(n)||n<1||n>140)return {number:null,confidence:0,reason:'ongeldig nummer'};return {number:n,confidence:conf};
}
async function leesEenKeer(){
  if(!bestand)return;try{
    status('Foto voorbereiden...');await laadFoto();if(!window.cv||!cv.Mat){status('OpenCV is nog niet geladen. Probeer opnieuw.');return;}
    cirkels=vindCirkels();if(!cirkels.length){status('Geen ronde cirkels gevonden.');return;}
    const ordered=[...cirkels].sort((a,b)=>a.y-b.y||a.x-b.x),res=[];let onzeker=0;
    status(ordered.length+' cirkels gevonden. Cijfers herkennen...');
    for(let i=0;i<ordered.length;i++){const r=herkenCirkel(ordered[i]);res.push(r);if(!r.number||r.confidence<.12)onzeker++;if((i+1)%5===0||i===ordered.length-1)status('Herkenning: '+(i+1)+' van '+ordered.length+' cirkels verwerkt');}
    const nums=res.map(r=>r.number).filter(Boolean);tekst.value=nums.join(' ');bereken();
    const dup=nums.length-[...new Set(nums)].length;found.innerHTML+='<div class="small" style="margin-top:8px">Beeldclassificatie: '+nums.length+' geldige lezingen uit '+ordered.length+' cirkels.'+(onzeker?' '+onzeker+' onzekere lezing(en).':' Geen onzekere lezingen.')+'</div>';
    if(nums.length!==ordered.length||dup||onzeker){found.innerHTML+='<div class="warn"><b>Controle nodig:</b> er is geen 100%-verificatie. Corrigeer de tekst hierboven voordat je de ontbrekende nummers gebruikt.</div>';check.innerHTML='<div class="warn"><b>Niet 100% geverifieerd.</b></div>';}else{found.innerHTML+='<div class="good"><b>Alle cirkels zijn zonder dubbele uitkomst herkend.</b></div>';check.innerHTML='<div class="good"><b>Technische controle geslaagd.</b> Dit betekent niet dat visuele fouten onmogelijk zijn.</div>';}
  }catch(err){console.error(err);status('Fout: '+(err.message||err));}
}
foto.addEventListener('change',async e=>{bestand=e.target.files[0];if(bestand)await leesEenKeer();});
document.getElementById('lees').onclick=()=>leesEenKeer();document.getElementById('bereken').onclick=()=>bereken();
