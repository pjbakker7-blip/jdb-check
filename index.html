<!DOCTYPE html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JdB PRO Android</title><script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script><style>body{font-family:system-ui;padding:16px;max-width:620px;margin:auto}input,button,textarea{font-size:18px;padding:14px;width:100%;margin-top:10px;border-radius:10px;border:1px solid #ccc;box-sizing:border-box}button{font-weight:700}pre{background:#f4f4f4;padding:14px;white-space:pre-wrap;border-radius:10px}canvas{max-width:100%;display:none}</style></head><body>
<h2>JdB 1-140 - Android versie</h2>
<input type="file" accept="image/*" capture="environment" id="foto"><canvas id="prev"></canvas>
<textarea id="hand" rows="4"></textarea>
<button id="bereken" style="background:#000;color:#fff;border:0">Bereken ontbrekende</button>
<pre id="out">Wachten...</pre>
<button id="save" style="display:none;background:#007aff;color:#fff;border:0">Opslaan / Delen naar OneDrive</button>
<script>
let laatste=""; const out=document.getElementById('out'),hand=document.getElementById('hand'),canvas=document.getElementById('prev');
async function prep(f){const img=new Image();img.src=URL.createObjectURL(f);await new Promise(r=>img.onload=r);const s=2.8;canvas.width=img.width*s;canvas.height=img.height*s;canvas.style.display='block';const c=canvas.getContext('2d');c.drawImage(img,0,0,canvas.width,canvas.height);let d=c.getImageData(0,0,canvas.width,canvas.height);for(let i=0;i<d.data.length;i+=4){let v=0.34*d.data[i]+0.5*d.data[i+1]+0.16*d.data[i+2];v=v>150?255:0;d.data[i]=d.data[i+1]=d.data[i+2]=v;}c.putImageData(d,0,0);return canvas;}
async function bereken(txt){const gev=[...new Set((txt.match(/\d+/g)||[]).map(Number).filter(n=>n>=1&&n<=140))].sort((a,b)=>a-b);const alle=Array.from({length:140},(_,i)=>i+1);const miss=alle.filter(n=>!gev.includes(n));laatste=miss.join('\n');out.textContent=`GEVONDEN ${gev.length}: ${gev.join(', ')}\n\nONTBREKEND ${miss.length}:\n${laatste}`;document.getElementById('save').style.display='block';}
document.getElementById('foto').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;out.textContent="⏳ Lezen...";const c=await prep(f);const {data:{text}}=await Tesseract.recognize(c,'eng',{tessedit_char_whitelist:'0123456789, \n',psm:6});hand.value=text;await bereken(text);});
document.getElementById('bereken').onclick=()=>bereken(hand.value);
document.getElementById('save').onclick=async()=>{
 const naam=`JdB-${new Date().toISOString().slice(0,10)}.txt`; const blob=new Blob([laatste],{type:'text/plain'}); const file=new File([blob],naam,{type:'text/plain'});
 if(navigator.canShare&&navigator.canShare({files:[file]})){ try{await navigator.share({files:[file],title:naam}); return;}catch{}}
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=naam;a.click(); alert("Bestand in Downloads gezet. Open OneDrive app > Downloads >... > Verplaatsen naar jdb/@Sarel/mix ma-wo");
};
</script></body></html>
