<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JdB Nummer Scanner</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 20px;
    background: #f5f5f5;
}

button {
    font-size: 18px;
    padding: 12px 20px;
    margin: 8px 0;
}

#preview {
    max-width: 100%;
    margin-top: 15px;
}

#resultaat {
    font-size: 28px;
    font-weight: bold;
    margin-top: 20px;
}
</style>
</head>

<body>

<h2>JdB nummer scanner</h2>

<input
    type="file"
    id="foto"
    accept="image/*"
    capture="environment"
>

<br>

<button id="scan">Scan afbeelding</button>

<img id="preview">

<div id="status"></div>

<div id="resultaat"></div>

<canvas id="canvas" style="display:none"></canvas>

<script>

const foto = document.getElementById("foto");
const scan = document.getElementById("scan");
const preview = document.getElementById("preview");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d", {willReadFrequently:true});

foto.addEventListener("change", () => {

    if (!foto.files.length) return;

    const file = foto.files[0];

    preview.src = URL.createObjectURL(file);
    preview.onload = () => {

        canvas.width = preview.naturalWidth;
        canvas.height = preview.naturalHeight;

        ctx.drawImage(
            preview,
            0,
            0,
            canvas.width,
            canvas.height
        );
    };
});


/*
==========================================================
  KLEURBEOORDELING
==========================================================

  We zoeken NIET naar vaste posities.

  Voor ieder door OCR gevonden getal bekijken we de pixels
  rond de letters.

  WIT:
      wordt genegeerd

  GROEN:
      wordt meegenomen

  ZWART:
      wordt genegeerd omdat het geen groen getal is

  Hierdoor zijn vaste 7 x 10 posities niet nodig.
==========================================================
*/

function pixelKleur(x, y) {

    if (
        x < 0 ||
        y < 0 ||
        x >= canvas.width ||
        y >= canvas.height
    ) {
        return null;
    }

    const p = ctx.getImageData(x, y, 1, 1).data;

    return {
        r: p[0],
        g: p[1],
        b: p[2]
    };
}


function isGroen(c) {

    if (!c) return false;

    /*
      Groen cijfer:
      G duidelijk groter dan R en B.
    */

    return (
        c.g > 60 &&
        c.g > c.r * 1.15 &&
        c.g > c.b * 1.08
    );
}


function isWit(c) {

    if (!c) return false;

    return (
        c.r > 175 &&
        c.g > 175 &&
        c.b > 175 &&
        Math.max(c.r,c.g,c.b) -
        Math.min(c.r,c.g,c.b) < 45
    );
}


/*
==========================================================
  BEPAAL OF HET OCR-VAK EEN GROEN GETAL BEVAT
==========================================================
*/

function groenPercentage(bbox) {

    const x0 = Math.max(0, Math.floor(bbox.x0));
    const y0 = Math.max(0, Math.floor(bbox.y0));

    const x1 = Math.min(
        canvas.width - 1,
        Math.ceil(bbox.x1)
    );

    const y1 = Math.min(
        canvas.height - 1,
        Math.ceil(bbox.y1)
    );

    let groen = 0;
    let gekleurd = 0;

    /*
      We bekijken alle pixels in het OCR-vak.
    */

    const image = ctx.getImageData(
        x0,
        y0,
        x1 - x0 + 1,
        y1 - y0 + 1
    );

    for (let i = 0; i < image.data.length; i += 4) {

        const c = {
            r: image.data[i],
            g: image.data[i+1],
            b: image.data[i+2]
        };

        /*
          Alleen duidelijk gekleurde pixels tellen.
        */

        if (!isWit(c)) {

            gekleurd++;

            if (isGroen(c)) {
                groen++;
            }
        }
    }

    if (gekleurd === 0) return 0;

    return groen / gekleurd;
}


/*
==========================================================
  OCR
==========================================================
*/

scan.addEventListener("click", async () => {

    if (!foto.files.length) {

        alert("Maak eerst een foto.");
        return;
    }

    document.getElementById("status").textContent =
        "Afbeelding wordt gescand...";

    document.getElementById("resultaat").textContent = "";

    try {

        const resultaat = await Tesseract.recognize(
            preview,
            "eng",
            {
                logger: m => {

                    if (m.status) {

                        document.getElementById("status")
                            .textContent =
                            m.status +
                            " " +
                            Math.round((m.progress || 0) * 100) +
                            "%";
                    }
                }
            }
        );

        const woorden = resultaat.data.words;

        const gevonden = new Set();

        /*
          We gebruiken uitsluitend getallen 1 t/m 140.
        */

        for (const woord of woorden) {

            let tekst = woord.text
                .replace(/[^\d]/g, "");

            if (!tekst) continue;

            const nummer = parseInt(tekst, 10);

            if (
                nummer < 1 ||
                nummer > 140
            ) {
                continue;
            }

            /*
              OCR kan een getal verkeerd lezen.
              Alleen voldoende duidelijke OCR-resultaten
              worden meegenomen.
            */

            if (
                typeof woord.confidence === "number" &&
                woord.confidence < 20
            ) {
                continue;
            }

            /*
              BELANGRIJK:

              Niet de positie bepaalt het nummer.

              We kijken uitsluitend naar de kleur van
              de letters in het OCR-vak.
            */

            const groen =
                groenPercentage(woord.bbox);

            /*
              Een groen getal heeft doorgaans een duidelijk
              aandeel groene pixels.

              De drempel is bewust laag omdat 17 en 22 op
              de voorbeeldfoto lichtgroen zijn.
            */

            if (groen >= 0.08) {

                gevonden.add(nummer);
            }
        }


        /*
        ==================================================
          RESULTAAT
        ==================================================
        */

        const lijst =
            [...gevonden]
            .filter(n => n >= 1 && n <= 140)
            .sort((a,b) => a-b);

        if (lijst.length === 0) {

            document.getElementById("resultaat")
                .textContent =
                "Geen groene nummers gevonden.";

        } else {

            document.getElementById("resultaat")
                .textContent =
                "Groene nummers: " +
                lijst.join(", ");
        }

        document.getElementById("status")
            .textContent =
            "Scan gereed.";

    } catch (error) {

        console.error(error);

        document.getElementById("status")
            .textContent =
            "Fout tijdens het scannen.";
    }
});

</script>

</body>
</html>
