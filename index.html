<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>JdB 1-140 – snelle OCR en e-mail</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/opencv.js@1.0.0/opencv.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;margin:0;padding:14px;background:#f4f4f4;color:#111}
main{max-width:760px;margin:auto}
h2{margin:2px 0 5px}
p{font-size:14px;color:#555;line-height:1.4}
button,input,textarea{width:100%;font-size:18px;padding:14px;margin-top:9px;border-radius:11px;border:1px solid #aaa}
button{font-weight:bold;border:0}
.black{background:#111;color:#fff}.blue{background:#1565c0;color:#fff}.green{background:#107c10;color:#fff}
#status,#result,#found{background:#fff;border-radius:11px;padding:12px;margin-top:12px}
#result{font-size:23px;font-weight:bold;line-height:1.55}
#found{font-size:16px;line-height:1.6}
textarea{min-height:100px}
canvas{width:100%;height:auto;border-radius:10px;margin-top:12px;background:#000}
.hidden{display:none}
.small{font-size:13px;color:#666;font-weight:normal}
.warn{background:#fff3cd;padding:10px;border-radius:9px;margin-top:10px}
</style>
</head>

<body>
<main>
<h2>JdB 1–140</h2>
<p>
<strong>Snelle versie:</strong> de software zoekt ronde cirkels op basis van vorm,
niet op kleur en niet met een 14×10-raster. Daarna wordt de hele foto
<strong>maar één keer</strong> door OCR gelezen.
</p>

<input id="foto" type="file" accept="image/*" capture="environment">

<canvas id="beeld"></canvas>

<div id="status">Maak een foto van het bord.</div>

<textarea id="tekst" placeholder="Hier komen de door OCR gelezen nummers. Corrigeer hier eventueel een fout en druk daarna op Bereken."></textarea>

<button id="lees" class="black">Foto opnieuw lezen</button>
<button id="bereken" class="blue">Bereken ontbrekende nummers</button>

<div id="result" class="hidden"></div>
<div id="found" class="hidden"></div>

<button id="mail" class="green hidden">Excel mailen</button>
<button id="excel" class="blue hidden">Excel lokaal downloaden</button>
<div id="mailstatus" class="small" style="margin-top:8px"></div>
</main>

<script>
const foto=document.getElementById('foto');
const canvas=document.getElementById('beeld');
const ctx=canvas.getContext('2d');
const statusEl=document.getElementById('status');
const tekst=document.getElementById('tekst');
const result=document.getElementById('result');
const found=document.getElementById('found');
const excelBtn=document.getElementById('excel');
const mailBtn=document.getElementById('mail');
const mailstatus=document.getElementById('mailstatus');

// Eenmalig invullen na het aanmaken van je EmailJS-account.
const EMAILJS_PUBLIC_KEY = '';
const EMAILJS_SERVICE_ID = '';
const EMAILJS_TEMPLATE_ID = '';
const EMAILJS_RECIPIENTS = ['container@jdb-barendrecht.nl','pjbakker7@outlook.com'];
if (EMAILJS_PUBLIC_KEY) emailjs.init({publicKey: EMAILJS_PUBLIC_KEY});

let bestand=null;
let gevonden=[];
let ontbrekend=[];
let excelBlob=null;
let excelNaam='';

function status(s){statusEl.textContent=s}

function getNumbers(s){
  return [...new Set((s.match(/\d+/g)||[])
    .map(Number)
    .filter(n=>n>=1&&n<=140))]
    .sort((a,b)=>a-b);
}

function bereken(){
  gevonden=getNumbers(tekst.value);
  const alle=Array.from({length:140},(_,i)=>i+1);
  ontbrekend=alle.filter(n=>!gevonden.includes(n));

  result.classList.remove('hidden');
  result.innerHTML='<b>Ontbrekend ('+ontbrekend.length+'):</b><br>'+
    '<span style="font-size:27px">'+ontbrekend.join(' &nbsp; ')+'</span>';

  found.classList.remove('hidden');
  found.innerHTML='<b>Unieke nummers herkend ('+gevonden.length+'):</b><br>'+
    gevonden.join(', ')+
    '<div class="small">Let op: als OCR een nummer niet heeft gelezen, verschijnt dat nummer ook bij ontbrekend. Daarom tonen we hieronder ook het aantal gevonden cirkels.</div>';

  maakExcel();
  excelBtn.classList.remove('hidden');
  mailBtn.classList.remove('hidden');
}

function maakExcel(){
  const rows=[
    ['JdB 1-140 - ontbrekende nummers'],
    ['Datum',new Date().toLocaleString('nl-NL')],
    ['Aantal gevonden nummers',gevonden.length],
    ['Aantal ontbrekende nummers',ontbrekend.length],
    [],
    ['Ontbrekende nummers']
  ];
  ontbrekend.forEach(n=>rows.push([n]));

  const ws=XLSX.utils.aoa_to_sheet(rows);
  ws['!cols']=[{wch:32}];
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'Ontbrekend');

  const bytes=XLSX.write(wb,{bookType:'xlsx',type:'array'});
  excelBlob=new Blob([bytes],{
    type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'
  });
  excelNaam='JdB_ontbrekende_nummers_'+
    new Date().toISOString().slice(0,10)+'.xlsx';
}

async function laadFoto(){
  const img=new Image();
  img.src=URL.createObjectURL(bestand);
  await new Promise((ok,fout)=>{img.onload=ok;img.onerror=fout});

  // Voor snelheid en een voorspelbare OCR-belasting.
  const max=2200;
  const schaal=Math.min(1,max/img.width);
  canvas.width=Math.round(img.width*schaal);
  canvas.height=Math.round(img.height*schaal);
  ctx.drawImage(img,0,0,canvas.width,canvas.height);
  URL.revokeObjectURL(img.src);
}

/*
 * Circle detection is uitsluitend vormgebaseerd.
 * De kleur van de cirkel wordt nergens gebruikt.
 *
 * We detecteren op een verkleinde kopie. Daardoor is het snel.
 * We verwachten GEEN bepaald aantal cirkels en gebruiken geen raster.
 */
function vindCirkels(){
  const scale=Math.min(1,1600/canvas.width);
  const sw=Math.round(canvas.width*scale);
  const sh=Math.round(canvas.height*scale);

  const klein=document.createElement('canvas');
  klein.width=sw;klein.height=sh;
  klein.getContext('2d').drawImage(canvas,0,0,sw,sh);

  const src=cv.imread(klein);
  const gray=new cv.Mat();
  const blur=new cv.Mat();

  cv.cvtColor(src,gray,cv.COLOR_RGBA2GRAY);
  cv.GaussianBlur(gray,blur,new cv.Size(5,5),1.2);

  // Parameters afgestemd op de verhouding van de cirkels op het bord.
  const circles=new cv.Mat();
  cv.HoughCircles(
    blur,circles,cv.HOUGH_GRADIENT,
    1.2,25,100,24,12,65
  );

  // Bij een dicht bord proberen we één keer iets ruimer, uitsluitend op vorm.
  if(circles.cols < 120){
    const extra=new cv.Mat();
    cv.HoughCircles(blur,extra,cv.HOUGH_GRADIENT,1.2,23,100,21,10,75);
    for(let i=0;i<extra.cols;i++){
      const x=extra.data32F[i*3]/scale;
      const y=extra.data32F[i*3+1]/scale;
      const r=extra.data32F[i*3+2]/scale;
      let dichtbij=false;
      for(let j=0;j<circles.cols;j++){
        const x2=circles.data32F[j*3]/scale;
        const y2=circles.data32F[j*3+1]/scale;
        const r2=circles.data32F[j*3+2]/scale;
        if(Math.hypot(x-x2,y-y2) < Math.min(r,r2)*0.65){dichtbij=true;break;}
      }
      if(!dichtbij){
        const old=Array.from(circles.data32F);
        old.push(x*scale,y*scale,r*scale);
        circles.create(old.length/3,1,cv.CV_32FC3);
        circles.data32F.set(old);
      }
    }
    extra.delete();
  }

  const out=[];
  for(let i=0;i<circles.cols;i++){
    out.push({
      x:circles.data32F[i*3]/scale,
      y:circles.data32F[i*3+1]/scale,
      r:circles.data32F[i*3+2]/scale
    });
  }

  src.delete();gray.delete();blur.delete();circles.delete();
  return out;
}

function cropVoorOCR(cirkels){
  // Alleen het gebied waarin de gevonden cirkels liggen.
  // Zo vallen telefoonknoppen en de rest van de foto buiten de OCR.
  const minX=Math.max(0,Math.min(...cirkels.map(c=>c.x-c.r))-30);
  const minY=Math.max(0,Math.min(...cirkels.map(c=>c.y-c.r))-30);
  const maxX=Math.min(canvas.width,Math.max(...cirkels.map(c=>c.x+c.r))+30);
  const maxY=Math.min(canvas.height,Math.max(...cirkels.map(c=>c.y+c.r))+30);

  const w=Math.round(maxX-minX),h=Math.round(maxY-minY);
  const c=document.createElement('canvas');
  c.width=w;c.height=h;
  c.getContext('2d').drawImage(canvas,minX,minY,w,h,0,0,w,h);
  return c;
}

async function leesEenKeer(){
  if(!bestand)return;

  status('Foto voorbereiden...');
  await laadFoto();

  if(!window.cv||!cv.Mat){
    status('OpenCV is nog niet geladen. Probeer na enkele seconden opnieuw.');
    return;
  }

  let cirkels=vindCirkels();

  if(!cirkels.length){
    status('Geen ronde cirkels gevonden. Maak de foto scherper en zorg dat het bord volledig in beeld staat.');
    return;
  }

  status(cirkels.length+' ronde cirkels gevonden. Eén OCR-bewerking starten...');

  const crop=cropVoorOCR(cirkels);
  const g=document.createElement('canvas');
  g.width=crop.width;g.height=crop.height;
  const gc=g.getContext('2d');

  const img= crop.getContext('2d').getImageData(0,0,crop.width,crop.height);
  for(let i=0;i<img.data.length;i+=4){
    const v=.299*img.data[i]+.587*img.data[i+1]+.114*img.data[i+2];
    // Witte cijfers worden wit; de donkere/groene cirkels worden zwart.
    const p=v>215?255:0;
    img.data[i]=img.data[i+1]=img.data[i+2]=p;
  }
  gc.putImageData(img,0,0);

  // Eén enkele Tesseract-recognize voor de volledige foto.
  const resultOCR=await Tesseract.recognize(g,'eng',{
    logger:m=>{
      if(m.status==='recognizing text')
        status('OCR bezig... '+Math.round((m.progress||0)*100)+'%');
      else if(m.status)
        status('OCR: '+m.status);
    },
    tessedit_char_whitelist:'0123456789',
    preserve_interword_spaces:'0',
    user_defined_dpi:'300',
    tessedit_pageseg_mode:'11'
  });

  const data=resultOCR.data;
  const woorden=[];

  // De OCR-coördinaten zijn ten opzichte van 'crop'. Gebruik daarom
  // exact de crop-offset die cropVoorOCR heeft gebruikt.
  const minX=Math.max(0,Math.min(...cirkels.map(c=>c.x-c.r))-30);
  const minY=Math.max(0,Math.min(...cirkels.map(c=>c.y-c.r))-30);

  for(const w of (data.words||[])){
    const raw=(w.text||'').trim().replace(/[^0-9]/g,'');
    if(!/^\d{1,3}$/.test(raw))continue;
    const n=Number(raw);
    if(n<1||n>140)continue;

    const cx=w.bbox.x0+w.bbox.width/2;
    const cy=w.bbox.y0+w.bbox.height/2;

    let beste=null;
    cirkels.forEach((c,i)=>{
      const lx=c.x-minX, ly=c.y-minY;
      const dist=Math.hypot(cx-lx,cy-ly);
      if(!beste || dist<beste.dist) beste={i,dist};
    });

    if(beste){
      const c=cirkels[beste.i];
      // Iets ruimere tolerantie voor perspectief en OCR-boxen.
      if(beste.dist <= c.r*1.20){
        woorden.push({i:beste.i,n,conf:Number(w.confidence||0),dist:beste.dist/c.r,x:cx,y:cy});
      }
    }
  }

  // Eén nummer per gedetecteerde cirkel; hoogste OCR-confidence wint.
  woorden.sort((a,b)=>b.conf-a.conf);
  const perCirkel=new Map();
  for(const w of woorden){
    if(!perCirkel.has(w.i)) perCirkel.set(w.i,w);
  }

  // Als de cirkelkoppeling door een lastige foto niets oplevert,
  // gebruik de geldige OCR-nummers uit dezelfde krappe bordcrop als noodfallback.
  // Zo blijft de gebruiker niet met '0 nummers herkend' zitten.
  if(perCirkel.size===0){
    for(const w of (data.words||[])){
      const raw=(w.text||'').trim().replace(/[^0-9]/g,'');
      if(/^\d{1,3}$/.test(raw)){
        const n=Number(raw);
        if(n>=1&&n<=140&&!perCirkel.has('n'+n)) perCirkel.set('n'+n,{n,conf:Number(w.confidence||0)});
      }
    }
  }

  const gelezen=[...perCirkel.values()].map(x=>x.n);
  tekst.value=gelezen.join(' ');
  bereken();

  const dubbele=woorden.map(x=>x.n).filter((n,i,a)=>a.indexOf(n)!==i);

  let melding=cirkels.length+' ronde cirkels gevonden. Eén OCR-bewerking uitgevoerd. '+
    gelezen.length+' unieke nummers herkend.';

  if(cirkels.length<120){
    melding+=' Let op: de cirkeldetectie vond '+cirkels.length+
      ' cirkels; dit hoeft niet fout te zijn, maar controleer de foto.';
  }

  status(melding);

  if(gelezen.length<cirkels.length){
    found.innerHTML +=
      '<div class="warn"><b>Controle nodig:</b> OCR heeft niet alle gevonden cirkels een nummer betrouwbaar opleverden. '+
      'Een nummer dat niet gelezen is, kan daardoor ten onrechte bij Ontbrekend staan.</div>';
  }
}

foto.addEventListener('change',async e=>{
  bestand=e.target.files[0];
  if(!bestand)return;
  result.classList.add('hidden');
  found.classList.add('hidden');
  excelBtn.classList.add('hidden');
  try{await leesEenKeer()}
  catch(e){
    console.error(e);
    status('Fout: '+(e.message||e));
  }
});

document.getElementById('lees').onclick=leesEenKeer;
document.getElementById('bereken').onclick=bereken;

excelBtn.onclick=()=>{
  if(!excelBlob)maakExcel();
  const url=URL.createObjectURL(excelBlob);
  const a=document.createElement('a');
  a.href=url;a.download=excelNaam;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),2000);
  status('Excelbestand lokaal gedownload.');
};

function blobToDataUri(blob){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>resolve(reader.result);
    reader.onerror=reject;
    reader.readAsDataURL(blob);
  });
}

async function blobToDataUri(blob){
  return await new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>resolve(reader.result);
    reader.onerror=reject;
    reader.readAsDataURL(blob);
  });
}

function sleep(ms){return new Promise(resolve=>setTimeout(resolve,ms));}

mailBtn.onclick=async()=>{
  if(!excelBlob)maakExcel();
  if(!EMAILJS_PUBLIC_KEY || !EMAILJS_SERVICE_ID || !EMAILJS_TEMPLATE_ID){
    mailstatus.textContent='Email is nog niet ingesteld. Vul eerst de drie EmailJS-gegevens in de HTML in.';
    return;
  }
  mailBtn.disabled=true;
  mailstatus.textContent='Excel wordt klaargemaakt en verzonden...';
  try{
    const dataUri=await blobToDataUri(excelBlob);
    for(let i=0;i<EMAILJS_RECIPIENTS.length;i++){
      await emailjs.send(EMAILJS_SERVICE_ID,EMAILJS_TEMPLATE_ID,{
        to_email:EMAILJS_RECIPIENTS[i],
        subject:'JdB ontbrekende nummers',
        message:'Bijgevoegd het Excelbestand met de ontbrekende nummers van bord 1-140.',
        attachment:dataUri,
        attachment_name:excelNaam
      });
      if(i<EMAILJS_RECIPIENTS.length-1) await sleep(1200);
    }
    mailstatus.textContent='Klaar: Excel is naar beide e-mailadressen verzonden.';
  }catch(e){
    console.error(e);
    mailstatus.textContent='Verzenden is niet gelukt. Controleer de EmailJS-instellingen.';
  }finally{
    mailBtn.disabled=false;
  }
};

let cvTimer=setInterval(()=>{
  if(window.cv&&cv.Mat){
    clearInterval(cvTimer);
    status('Klaar voor een foto.');
  }
},250);
</script>
</body>
</html>
