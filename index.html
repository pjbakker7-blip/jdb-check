<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <title>JdB groene nummers – versie 27</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    *{box-sizing:border-box} body{margin:0;background:#f3f3f3;color:#111;font:16px Arial,sans-serif}
    main{max-width:780px;margin:auto;padding:14px} h2{margin:2px 0 8px} p{line-height:1.45;color:#444}
    input,button,textarea{width:100%;margin-top:10px;padding:14px;border:1px solid #aaa;border-radius:10px;font:18px Arial,sans-serif}
    button{border:0;background:#111;color:#fff;font-weight:bold;cursor:pointer} canvas{width:100%;height:auto;margin-top:12px;border-radius:10px;background:white}
    #status,#result{margin-top:12px;padding:12px;background:white;border-radius:10px} #result{font-size:22px;font-weight:bold;line-height:1.55}
    .hint{font-size:14px}.hidden{display:none}
  </style>
</head>
<body><main>
  <h2>JdB – groene nummers op witte achtergrond</h2>
  <p>Deze versie leest uitsluitend groene cijfers waarvan de directe omgeving overwegend wit/licht is. Groene schijven worden vóór OCR uitgesloten.</p>
  <input id="foto" type="file" accept="image/*" capture="environment">
  <canvas id="beeld"></canvas>
  <button id="lees">Lees foto opnieuw</button>
  <div id="status">Klaar voor een foto.</div>
  <div id="result" class="hidden"></div>
  <p class="hint">Alleen de gevonden nummers staan hieronder, één per regel.</p>
  <textarea id="tekst" aria-label="Gevonden nummers" placeholder="Hier verschijnen alleen de gevonden groene nummers."></textarea>
</main><script>
const foto=document.querySelector('#foto'),can=document.querySelector('#beeld'),ctx=can.getContext('2d',{willReadFrequently:true});
const statusEl=document.querySelector('#status'),result=document.querySelector('#result'),tekst=document.querySelector('#tekst');
let file=null;
const status=s=>statusEl.textContent=s;
// The ink on the white board is blue-green (not the saturated green of the disks).
const green=(r,g,b)=>g>55&&g>r*1.10&&g>=b-5&&g-r>18;
const light=(r,g,b)=>r>180&&g>180&&b>180&&Math.max(r,g,b)-Math.min(r,g,b)<70;
async function drawFile(){const image=new Image(),url=URL.createObjectURL(file); image.src=url; await image.decode(); const scale=Math.min(1,1600/image.width); can.width=Math.round(image.width*scale);can.height=Math.round(image.height*scale);ctx.drawImage(image,0,0,can.width,can.height);URL.revokeObjectURL(url)}
function findCharacters(){
  const im=ctx.getImageData(0,0,can.width,can.height),d=im.data,w=can.width,h=can.height,n=w*h;
  const mask=new Uint8Array(n),seen=new Uint8Array(n); for(let i=0,p=0;i<n;i++,p+=4)if(green(d[p],d[p+1],d[p+2]))mask[i]=1;
  const chars=[],qx=new Int32Array(n),qy=new Int32Array(n);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const start=y*w+x;if(!mask[start]||seen[start])continue;let top=0;qx[0]=x;qy[0]=y;seen[start]=1;let area=0,minX=x,maxX=x,minY=y,maxY=y;
    while(top>=0){const cx=qx[top],cy=qy[top--];area++;if(cx<minX)minX=cx;if(cx>maxX)maxX=cx;if(cy<minY)minY=cy;if(cy>maxY)maxY=cy;
      const add=(nx,ny)=>{if(nx<0||ny<0||nx>=w||ny>=h)return;const k=ny*w+nx;if(mask[k]&&!seen[k]){seen[k]=1;qx[++top]=nx;qy[top]=ny}};
      add(cx-1,cy);add(cx+1,cy);add(cx,cy-1);add(cx,cy+1);
    }
    const bw=maxX-minX+1,bh=maxY-minY+1;if(area<12||area>500||bw<3||bw>55||bh<7||bh>65)continue;
    // A printed green digit has a pale surround; a green disk never reaches this test because it is far too large.
    const pad=10,x0=Math.max(0,minX-pad),x1=Math.min(w,maxX+pad),y0=Math.max(0,minY-pad),y1=Math.min(h,maxY+pad);let pale=0,total=0;
    for(let yy=y0;yy<=y1;yy++)for(let xx=x0;xx<=x1;xx++){const p=(yy*w+xx)*4;if(!green(d[p],d[p+1],d[p+2])){total++;if(light(d[p],d[p+1],d[p+2]))pale++}}
    if(total&&pale/total>.75)chars.push({x:minX,y:minY,w:bw,h:bh,cx:(minX+maxX)/2,cy:(minY+maxY)/2});
  } return chars;
}
function makeGroups(chars){
  chars.sort((a,b)=>a.cy-b.cy||a.x-b.x);const rows=[];
  for(const c of chars){let row=rows.find(r=>Math.abs(r.y-c.cy)<18);if(!row){row={y:c.cy,items:[]};rows.push(row)}row.items.push(c);row.y=row.items.reduce((s,z)=>s+z.cy,0)/row.items.length}
  const groups=[];for(const row of rows){row.items.sort((a,b)=>a.x-b.x);let g=[];for(const c of row.items){if(!g.length||c.x-(g[g.length-1].x+g[g.length-1].w)<32)g.push(c);else{groups.push(g);g=[c]}}if(g.length)groups.push(g)}
  return groups.filter(g=>g.length>=1&&g.length<=3);
}
function cropAndMask(group){
  const pad=12,x0=Math.max(0,Math.min(...group.map(c=>c.x))-pad),y0=Math.max(0,Math.min(...group.map(c=>c.y))-pad),x1=Math.min(can.width,Math.max(...group.map(c=>c.x+c.w))+pad),y1=Math.min(can.height,Math.max(...group.map(c=>c.y+c.h))+pad);
  const source=ctx.getImageData(x0,y0,x1-x0,y1-y0),out=new ImageData(source.width,source.height);for(let i=0;i<source.data.length;i+=4){const v=green(source.data[i],source.data[i+1],source.data[i+2])?0:255;out.data[i]=out.data[i+1]=out.data[i+2]=v;out.data[i+3]=255}
  const small=document.createElement('canvas');small.width=out.width;small.height=out.height;small.getContext('2d').putImageData(out,0,0);const large=document.createElement('canvas');large.width=small.width*5;large.height=small.height*5;large.getContext('2d').imageSmoothingEnabled=false;large.getContext('2d').drawImage(small,0,0,large.width,large.height);return large;
}
async function read(){
  if(!file)return;try{result.classList.add('hidden');tekst.value='';status('Foto voorbereiden...');await drawFile();status('Zoeken naar groene cijfers op een witte achtergrond...');const groups=makeGroups(findCharacters());
    if(!groups.length){status('Geen groene cijfers op een witte achtergrond gevonden.');return}
    const worker=await Tesseract.createWorker('eng',1,{logger:m=>{if(m.status==='recognizing text')status('Cijferherkenning: '+Math.round((m.progress||0)*100)+'%')}});
    // Tesseract v5 expects parameters here, not as a nested recognize() option. That avoids “Cannot invert undefined to int”.
    await worker.setParameters({tessedit_pageseg_mode:7,tessedit_char_whitelist:'0123456789'});
    const values=[];for(let i=0;i<groups.length;i++){status('Groen nummer '+(i+1)+' van '+groups.length+' lezen...');const r=await worker.recognize(cropAndMask(groups[i]));const n=Number((r.data.text||'').replace(/\D/g,''));if(Number.isInteger(n)&&n>=1&&n<=140)values.push(n)}await worker.terminate();
    const found=[...new Set(values)].sort((a,b)=>a-b);tekst.value=found.join('\n');result.classList.remove('hidden');result.textContent=found.length?found.join('\n'):'Geen nummers gevonden.';status('Klaar: '+found.length+' groen nummer'+(found.length===1?'':'s')+' gevonden.');
  }catch(error){console.error(error);status('Fout: '+(error?.message||String(error)))}
}
foto.addEventListener('change',e=>{file=e.target.files[0];if(file)read()});document.querySelector('#lees').addEventListener('click',read);
</script></body></html>
